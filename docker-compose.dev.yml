# Override per lo sviluppo locale (NON usare in produzione).
#
# Espone PostgreSQL solo su 127.0.0.1, cosi' `scripts/dev.sh` e `scripts/test.sh`
# possono collegarsi dal computer host senza essere visibili sulla rete.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d db
#
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"
