services:
  gesart:
    build: .
    image: gesart:latest
    container_name: gesart
    restart: unless-stopped
    env_file:
      - stack.env
    environment:
      GESART_HOST: "0.0.0.0"
      GESART_PORT: "9080"
      GESART_DATA_DIR: "/data"
      GESART_IMPORTS_DIR: "/imports"
    ports:
      - "${GESART_PORT:-9080}:9080"
    volumes:
      # Database SQLite e file di staging: NON perderli.
      - gesart-data:/data
      # Cartella con i CSV/XLSX da importare (opzionale).
      - ./imports:/imports:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gesart-data:
